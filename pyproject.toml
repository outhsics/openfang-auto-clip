[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "openfang-auto-clip"
version = "0.6.0.dev0"
description = "Local-first CLI: long video in, 9:16 caption-burned clips out."
readme = "README_EN.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenFang Auto Clip Contributors" }]
dependencies = [
  "Flask>=3.0.0",
  "requests>=2.31.0",
  "yt-dlp>=2024.1.1",
  "openai-whisper>=20231117",
  "Pillow>=10.0.0",
]
keywords = [
  "video",
  "ffmpeg",
  "clips",
  "automation",
  "benchmark",
  "openfang",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
openfang-auto-clip = "auto_clip:main"
openfang = "auto_clip:main"

[tool.setuptools]
py-modules = ["auto_clip", "web_manager"]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
