name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## 🎉 OpenFang Auto Clip ${{ github.ref_name }}
            
            ### 📦 Installation
            
            \`\`\`bash
            pip install openfang-auto-clip==${{ github.ref_name }}
            \`\`\`
            
            ### 🚀 Quick Start
            
            \`\`\`bash
            git clone https://github.com/outhsics/openfang-auto-clip.git
            cd openfang-auto-clip
            git checkout ${{ github.ref_name }}
            pip install -e .
            \`\`\`
            
            ### 📖 Documentation
            
            - [README](https://github.com/outhsics/openfang-auto-clip/blob/main/README.md)
            - [Features](https://github.com/outhsics/openfang-auto-clip/blob/main/FEATURES.md)
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
