name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Prepare release bundle
        run: python scripts/release_prep.py "${GITHUB_REF_NAME}" --skip-tests --allow-dirty

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          for asset in \
            "benchmark_report.json" \
            "preview.png" \
            "storyboard.png" \
            "launch_post.md" \
            "launch_post_zh.md" \
            "github_social_preview.svg" \
            "github_social_preview_zh.svg" \
            "bundle_manifest.json"; do
            asset_path="dist/releases/${GITHUB_REF_NAME}/${asset}"
            if [ -f "${asset_path}" ]; then
              assets+=("${asset_path}")
            fi
          done

          gh release create "${GITHUB_REF_NAME}" \
            --title "OpenFang Auto Clip ${GITHUB_REF_NAME}" \
            --notes-file "dist/releases/${GITHUB_REF_NAME}/release_notes.md" \
            "${assets[@]}"
